name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASK_ENV: testing
  SECRET_KEY: "ci-test-key-which-is-at-least-32-characters-long"
  ENCRYPTION_KEY: "tVG8-i368hyvsKNRoBKqZIXuExByVbQgKrUHKvqNFis="
  DATABASE_URL: "sqlite:///:memory:"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  backend-tests:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/dev-requirements.txt
      - run: python -m pytest backend/tests/ -n auto -v --timeout=120 --cov=backend --cov-report=xml --cov-report=term-missing
        env:
          REDIS_URL: "redis://localhost:6379/0"
          DATABASE_URL: "sqlite:///:memory:"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          include-hidden-files: true

  backend-lint:
    name: Backend lint & format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.19
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - name: Error code checker
        run: python backend/scripts/check_error_codes.py

  backend-types:
    name: Backend type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/dev-requirements.txt
      - run: mypy . --no-incremental
        working-directory: backend

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-format:
    name: Frontend format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend

  frontend-tests:
    name: Frontend tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          include-hidden-files: true

  translations-check:
    name: Translations consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m json.tool frontend/public/locales/en/translation.json > /dev/null
      - run: python -m json.tool frontend/public/locales/bg/translation.json > /dev/null
      - name: Check translation key parity
        run: python frontend/scripts/check_translations.py

  frontend-types:
    name: Frontend type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check-types
        working-directory: frontend

  docker-build:
    name: Docker build + full stack smoke test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-test-password
      REDIS_PASSWORD: ci-redis-pass
      SECRET_KEY: ci-secret-key-0000000000000000000000
      ENCRYPTION_KEY: tVG8-i368hyvsKNRoBKqZIXuExByVbQgKrUHKvqNFis=
      WORKER_PUBLIC_KEY: gwEOQ7vkepTvOxbVFGy/iayILrRTEsYbw54+I5BF7RY=
      SERVER_ADDRESS: localhost
      MAIN_SERVER_URL: http://backend:5001
      SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@v7

      # --- Build images ---
      - run: docker build -t lavbench-backend backend/
      - run: docker build -t lavbench-frontend frontend/

      # --- Report image sizes to catch bloat ---
      - run: docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | grep lavbench

      # --- Start full stack ---
      - name: Start services
        run: |
          mkdir -p certs
          docker compose -f docker-compose.yml up -d

      - name: Wait for all services healthy
        run: |
          for svc in lavbench_db lavbench_redis lavbench_redis_cache lavbench_backend lavbench_beat lavbench_worker lavbench_frontend; do
            echo "Waiting for $svc..."
            for i in $(seq 1 45); do
              sleep 2
              status=$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null)
              [ "$status" = "healthy" ] && break
            done
            if [ "$status" != "healthy" ]; then
              echo "FAILED: $svc is $status (expected healthy)"
              docker logs "$svc" --tail 30
              exit 1
            fi
            echo "$svc is healthy"
          done

      # --- Build the evaluation worker image (backend/Dockerfile.worker) ---
      - name: Build evaluation worker image
        run: docker build -f backend/Dockerfile.worker -t lavbench-worker backend/

      # --- Run a real evaluation worker (cpu_queue) attached to the compose network ---
      # Proves end-to-end coordination: worker_spec registration, SSE pub/sub
      # channels, and evaluation of smoke-test submissions all share the broker.
      - name: Start evaluation worker
        run: |
          NETWORK=$(docker inspect -f '{{.HostConfig.NetworkMode}}' lavbench_backend)
          echo "Joining compose network: $NETWORK"
          # The worker creates submission sandboxes by talking to the host Docker
          # daemon through /var/run/docker.sock, so any bind-mounted dir (e.g.
          # temp_dir -> /app for the sandbox) must exist on the HOST. Bind the
          # workspace and task-images dirs at the same absolute path inside the
          # container (sandboxes bind-mount task_images/task_<id>/data as /app/data).
          mkdir -p "${GITHUB_WORKSPACE}/.lavbench_workspace"
          mkdir -p "${GITHUB_WORKSPACE}/.lavbench_task_images"
          docker run -d --name lavbench_eval_worker \
            --network "$NETWORK" \
            -e CELERY_BROKER_URL="redis://:${REDIS_PASSWORD}@redis:6379/0" \
            -e CELERY_RESULT_BACKEND="redis://:${REDIS_PASSWORD}@redis:6379/0" \
            -e CACHE_REDIS_URL="redis://:${REDIS_PASSWORD}@redis-cache:6379/1" \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e ENCRYPTION_KEY="${ENCRYPTION_KEY}" \
            -e WORKER_PRIVATE_KEY="NaKOt/qVZHOA4rAe6MmGoj/bNkHSG1FjTxrzcYL7zBU=" \
            -e MAIN_SERVER_URL="http://backend:5001" \
            -e RUNNING_AS_WORKER="true" \
            -e EVALUATION_ONLY_WORKER="true" \
            -e INTERNAL_ONLY_WORKER="false" \
            -e HF_CACHE_DIR="/app/hf_cache" \
            -e TASK_IMAGES_DIR="${GITHUB_WORKSPACE}/.lavbench_task_images" \
            -e LAVBENCH_WORKSPACE_DIR="${GITHUB_WORKSPACE}/.lavbench_workspace" \
            -e CPU_WORKER_CONCURRENCY="1" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/.lavbench_workspace:${GITHUB_WORKSPACE}/.lavbench_workspace" \
            -v "${GITHUB_WORKSPACE}/.lavbench_task_images:${GITHUB_WORKSPACE}/.lavbench_task_images" \
            lavbench-worker

      # --- Wait until the eval worker registered worker_spec:{hostname} in the broker Redis ---
      - name: Wait for evaluation worker registration
        run: |
          HOST=$(docker inspect -f '{{.Config.Hostname}}' lavbench_eval_worker)
          echo "Eval worker hostname: $HOST (expecting worker_spec:cpu@${HOST})"
          for i in $(seq 1 30); do
            KEYS=$(docker compose exec -T redis redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning --scan --pattern 'worker_spec:*' 2>/dev/null)
            if echo "$KEYS" | grep -q "worker_spec:cpu@${HOST}"; then
              echo "Evaluation worker registered in coordination Redis after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "FAILED: evaluation worker never registered worker_spec:cpu@${HOST}"
          docker logs lavbench_eval_worker --tail 50
          exit 1

      # --- Verify all containers are still running (no crashes) ---
      - name: Check all containers up
        run: |
          RUNNING=$(docker ps --format '{{.Names}} {{.Status}}')
          echo "Running containers:"
          echo "$RUNNING"
          EXPECTED="lavbench_db lavbench_redis lavbench_redis_cache lavbench_backend lavbench_beat lavbench_worker lavbench_frontend"
          for name in $EXPECTED; do
            echo "$RUNNING" | grep -q "^$name " || {
              echo "FAILED: $name is not running";
              docker logs "$name" --tail 20 2>/dev/null;
              exit 1;
            }
          done

      # --- Verify backend health endpoint ---
      - name: Health endpoint
        run: |
          echo "=== /api/health ==="
          curl -sS http://localhost:80/api/health | python3 -c "
          import json, sys
          body = json.load(sys.stdin)
          assert body.get('status') == 'ok', 'status is ' + str(body.get('status'))
          checks = body.get('checks', {})
          for name in ('database', 'redis', 'disk'):
              assert 'error' not in str(checks.get(name, '')), f'{name} check failed: {checks[name]}'
          print(json.dumps(body, indent=2))
          print('All health checks passed')
          "

      # --- Verify frontend serves the SPA ---
      - name: Frontend check
        run: |
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:80/)
          [ "$STATUS" = "200" ] || { echo "Frontend returned $STATUS"; exit 1; }
          curl -sS http://localhost:80/ | grep -q '<div id="root"' || {
            echo 'Frontend HTML missing <div id="root">';
            exit 1;
          }
          echo "Frontend is serving the SPA (HTTP 200)"

      # --- Run full-stack API smoke test against the live stack ---
      - name: Create admin user
        run: |
          docker compose exec -T backend python3 /app/setup-admin.py
          docker compose cp backend:/app/admin_credentials.txt ./admin_credentials.txt

      - name: Full-stack API smoke test (auth, roles, rate limits, backups, SSE, eval worker)
        run: |
          python3 -m pip install --user --break-system-packages --quiet pandas pyarrow
          python3 scripts/api_smoke_test.py
        env:
          SMOKE_EVALUATE: "1"

      # --- Remove the evaluation worker (not part of the compose stack) ---
      - name: Remove evaluation worker
        if: always()
        run: docker rm -f lavbench_eval_worker || true

      # --- Regenerate api.d.ts from the live spec and fail if it drifts ---
      - name: API type drift gate
        run: |
          cd frontend
          npm ci
          API_SPEC_URL=http://localhost:80/apidoc/openapi.json npm run generate-api-types
          if ! git diff --exit-code -- src/types/api.d.ts; then
            echo "ERROR: api.d.ts drifted from the backend OpenAPI spec."
            echo "Regenerate and commit it: cd frontend && API_SPEC_URL=http://localhost:80/apidoc/openapi.json npm run generate-api-types"
            exit 1
          fi
          echo "api.d.ts is up to date"

      # --- Regenerate docs/source/api spec snapshots from the live spec and fail if they drift ---
      - name: Docs API spec drift gate
        run: |
          API_SPEC_URL=http://localhost:80/apidoc/openapi.json make -C docs fetch-spec
          if ! git diff --exit-code -- docs/source/api docs/source/api_spec.rst; then
            echo "ERROR: docs API spec snapshots drifted from the backend OpenAPI spec."
            echo "Regenerate and commit them: API_SPEC_URL=http://localhost:80/apidoc/openapi.json make -C docs fetch-spec"
            exit 1
          fi
          echo "docs/source/api spec snapshots are up to date"

      # --- Clean up ---
      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.yml down --volumes

  docs-build:
    name: Build Sphinx documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: Build Sphinx
        env:
          API_SPEC_SKIP_FETCH: "true"
        run: cd docs && make html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sphinx-docs
          path: docs/build/
