name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --bump ${{ inputs.bump }} --unreleased
        env:
          OUTPUT: CHANGELOG.md

      - name: Bump version in project files
        env:
          VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          VERSION="${VERSION#v}"

          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' backend/pyproject.toml
          sed -i 's/"version": ".*"/"version": "'"$VERSION"'"/' frontend/package.json
          sed -i 's/^release = .*/release = "'"$VERSION"'"/' docs/source/conf.py

      - name: Ensure release label exists
        run: |
          gh label create release --color 5319e7 --description "Release PR" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create Release PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: release ${{ steps.git-cliff.outputs.version }}"
          title: "chore: release ${{ steps.git-cliff.outputs.version }}"
          body: "Automated release PR for ${{ steps.git-cliff.outputs.version }}."
          branch: "release/${{ steps.git-cliff.outputs.version }}"
          base: main
          labels: release
          delete-branch: true
