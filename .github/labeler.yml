backend:
  - changed-files:
      - any-glob-to-any-file: 'backend/**'

frontend:
  - changed-files:
      - any-glob-to-any-file: 'frontend/**'

ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

docker:
  - changed-files:
      - any-glob-to-any-file: ['**/Dockerfile*', 'docker-compose.yml']

docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', 'guides/**', 'README.md', 'CONTRIBUTING.md']

scripts:
  - changed-files:
      - any-glob-to-any-file: 'scripts/**'
