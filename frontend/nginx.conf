gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
gzip_min_length 256;

# Reused connections to gunicorn instead of a new TCP connection per request. Gunicorn
# keeps idle connections for 75 s (backend/Dockerfile), longer than nginx's 60 s, so nginx
# never sends a request on a connection gunicorn is closing
upstream backend_api {
    server backend:5001;
    keepalive 64;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name localhost;
    # Default request body cap. Only the admin upload, notebook parse and worker
    # report locations inside /api raise it; the backend enforces each route's limit
    client_max_body_size 10m;

    # Answer oversized bodies in the API's error shape instead of nginx's HTML page
    error_page 413 = @request_too_large;
    location @request_too_large {
        default_type application/json;
        return 413 '{"error": "Request payload too large", "code": "ERR_PAYLOAD_TOO_LARGE"}';
    }

    # Access log to stdout only, where Docker's json-file driver rotates it
    access_log /dev/stdout;
    # Error log to stderr only, rotated by Docker like the access log
    error_log /dev/stderr;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve built static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls directly to the Flask Backend container
    location /api {
        proxy_pass http://backend_api/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client-supplied X-Forwarded-For cannot
        # spoof the IP used for rate limiting / audit logs. Backend trusts the
        # first XFF entry (see ProxyFix x_for=1) and X-Real-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 with an empty Connection header keeps upstream connections alive
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # Buffer responses so a slow client never holds a gunicorn greenlet; SSE streams
        # opt out per response with X-Accel-Buffering: no. Nothing is spooled to disk, so a
        # large download streams at the client's pace as before
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 16k;
        proxy_busy_buffers_size 64k;
        proxy_max_temp_file_size 0;
        proxy_cache off;

        # Increase timeouts to prevent dropping active SSE streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Admin multipart uploads: task create and update (notebooks and the
        # evaluator, 16 MiB each), challenge ZIP import and competitor CSV
        # import. This nested location inherits every proxy setting above.
        # proxy_pass is repeated without a URI part because nginx forbids one
        # in regex locations; the request URI then passes through unchanged
        location ~ "^/api/(challenges/[0-9a-fA-F-]{36}/tasks|tasks/[0-9a-fA-F-]{36}|challenges/import|admin/import-competitors-csv)$" {
            client_max_body_size 256m;
            proxy_pass http://backend_api;
        }

        # Data files and the HF ZIP stream as one raw body each, up to 10 GiB, unbuffered
        location ~ "^/api/tasks/[0-9a-fA-F-]{36}/(files/[^/]+|hf-zip)$" {
            client_max_body_size 11g;
            proxy_request_buffering off;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            client_body_timeout 300s;
            proxy_pass http://backend_api;
        }

        # Competitors upload their notebook to pick cells from it; saved outputs
        # (plots, images) easily push an .ipynb past the 10 MB default. The backend
        # allows MAX_NOTEBOOK_BYTES (16 MiB); nginx caps above it, so a notebook just over
        # the limit still reaches the backend and gets the precise error with the limit
        location ~ "^/api/challenges/[0-9a-fA-F-]{36}/parse-notebook$" {
            client_max_body_size 20m;
            proxy_pass http://backend_api;
        }

        # Evaluation workers post results and logs here. The backend truncates
        # logs on receipt, but a verbose run's report can exceed the default cap
        location ~ "^/api/(worker/|workers/logs$)" {
            client_max_body_size 100m;
            proxy_pass http://backend_api;
        }
    }

    # Expose the spectree OpenAPI endpoint so api.d.ts and docs can be
    # regenerated from the reachable :80 address (no backend host port).
    location /apidoc {
        proxy_pass http://backend_api/apidoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error handling page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
