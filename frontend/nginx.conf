gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
gzip_min_length 256;

server {
    listen 80;
    server_name localhost;
    # Default request body cap. Only the admin upload, notebook parse and worker
    # report locations inside /api raise it; the backend enforces each route's limit
    client_max_body_size 10m;

    # Answer oversized bodies in the API's error shape instead of nginx's HTML page
    error_page 413 = @request_too_large;
    location @request_too_large {
        default_type application/json;
        return 413 '{"error": "Request payload too large", "code": "ERR_PAYLOAD_TOO_LARGE"}';
    }

    # Access log to stdout only, where Docker's json-file driver rotates it
    access_log /dev/stdout;
    # Error log to stderr only, rotated by Docker like the access log
    error_log /dev/stderr;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve built static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls directly to the Flask Backend container
    location /api {
        proxy_pass http://backend:5001/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client-supplied X-Forwarded-For cannot
        # spoof the IP used for rate limiting / audit logs. Backend trusts the
        # first XFF entry (see ProxyFix x_for=1) and X-Real-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTP/1.1 and persistent connection configuration for SSE (Server-Sent Events)
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        
        # Disable buffering and caching to allow real-time streaming of events and logs
        proxy_buffering off;
        proxy_cache off;
        
        # Increase timeouts to prevent dropping active SSE streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Admin multipart uploads, up to 2 GB: task create and update with
        # files, challenge ZIP import and competitor CSV import. This nested
        # location inherits every proxy setting above. proxy_pass is repeated
        # without a URI part because nginx forbids one in regex locations; the
        # request URI then passes through unchanged
        location ~ "^/api/(challenges/[0-9a-fA-F-]{36}/tasks|tasks/[0-9a-fA-F-]{36}|challenges/import|admin/import-competitors-csv)$" {
            client_max_body_size 2g;
            proxy_pass http://backend:5001;
        }

        # Competitors upload their notebook to pick cells from it; saved outputs
        # (plots, images) easily push an .ipynb past the 10 MB default
        location ~ "^/api/challenges/[0-9a-fA-F-]{36}/parse-notebook$" {
            client_max_body_size 50m;
            proxy_pass http://backend:5001;
        }

        # Evaluation workers post results and logs here. The backend truncates
        # logs on receipt, but a verbose run's report can exceed the default cap
        location ~ "^/api/(worker/|workers/logs$)" {
            client_max_body_size 100m;
            proxy_pass http://backend:5001;
        }
    }

    # Expose the spectree OpenAPI endpoint so api.d.ts and docs can be
    # regenerated from the reachable :80 address (no backend host port).
    location /apidoc {
        proxy_pass http://backend:5001/apidoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error handling page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
