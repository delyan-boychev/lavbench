# Application settings from .env reach the backend through env_file. The long
# syntax needs Compose 2.24+; `required: false` lets CI and fresh checkouts run
# without a .env. The backend's `environment:` entries win over env_file, which
# keeps the localhost URLs in .env out of the compose network. Beat and the
# internal workers get no env_file on purpose: they receive an explicit allowlist
# of settings, so no server secret added to .env can ever reach them.
x-app-env-file: &app-env-file
  - path: .env
    required: false

# Settings both internal workers receive (an explicit allowlist, see the top)
x-internal-env: &internal-env
  # In-network URLs only — .env's localhost URLs are for `make dev` and
  # must never be interpolated into the compose network.
  DATABASE_URL: "postgresql://${POSTGRES_USER:-lavbench_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lavbench_db}"
  CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  CACHE_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis-cache:6379/1"
  WORKER_ENCRYPTION_KEY: "${WORKER_ENCRYPTION_KEY:-${ENCRYPTION_KEY}}"
  HF_CACHE_DIR: "/var/lib/lavbench/hf_cache"
  TASK_IMAGES_DIR: "/var/lib/lavbench/task_images"
  LAVBENCH_WORKSPACE_DIR: "/var/lib/lavbench/workspace"
  UPLOAD_FOLDER: "/app/uploads"
  REDIS_SSL_CA_CERTS: "${REDIS_SSL_CA_CERTS:-}"
  REDIS_SSL_CERTFILE: "${REDIS_SSL_CERTFILE:-}"
  REDIS_SSL_KEYFILE: "${REDIS_SSL_KEYFILE:-}"
  REDIS_SSL_CERT_REQS: "${REDIS_SSL_CERT_REQS:-required}"
  BACKUPS_DIR: "/backups"
  WORKER_ROLE: "internal"
  CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-2}"
  MAIN_SERVER_URL: "${MAIN_SERVER_URL:-http://frontend:80}"
  # Allowlisted settings for the system tasks this worker runs (backups,
  # leaderboard recalculation, watchdog); everything else keeps its default
  BACKUP_RETENTION_COUNT: "${BACKUP_RETENTION_COUNT:-3}"
  BACKUP_DB_RETENTION_COUNT: "${BACKUP_DB_RETENTION_COUNT:-18}"
  BACKUP_UPLOADS_INTERVAL_SECONDS: "${BACKUP_UPLOADS_INTERVAL_SECONDS:-21600}"
  MIN_BACKUP_DISK_GB: "${MIN_BACKUP_DISK_GB:-1}"
  BACKUP_TIMEOUT: "${BACKUP_TIMEOUT:-600}"
  BACKUP_UPLOADS_TIMEOUT: "${BACKUP_UPLOADS_TIMEOUT:-3600}"
  DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
  DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-10}"
  # The nanoColab sync runs here
  DEADLINE_GRACE_PERIOD_SECONDS: "${DEADLINE_GRACE_PERIOD_SECONDS:-180}"
  NANOCOLAB_API_URL: "${NANOCOLAB_API_URL:-}"
  NANOCOLAB_API_KEY_FILE: "${NANOCOLAB_API_KEY_FILE:-}"
  NANOCOLAB_TIMEOUT_SECONDS: "${NANOCOLAB_TIMEOUT_SECONDS:-10}"
  NANOCOLAB_ALLOW_INSECURE_HTTP: "${NANOCOLAB_ALLOW_INSECURE_HTTP:-false}"
  NANOCOLAB_SYNC_INTERVAL_SECONDS: "${NANOCOLAB_SYNC_INTERVAL_SECONDS:-60}"
  NANOCOLAB_PACKAGE_MAX_BYTES: "${NANOCOLAB_PACKAGE_MAX_BYTES:-10737418240}"
  NANOCOLAB_AUTO_PUBLISH_LEAD_HOURS: "${NANOCOLAB_AUTO_PUBLISH_LEAD_HOURS:-24}"
  NANOCOLAB_ATTENDANCE_HEADROOM_PERCENT: "${NANOCOLAB_ATTENDANCE_HEADROOM_PERCENT:-5}"

# Only the short-job worker dispatches runs, so only it gets the split secret
x-dispatch-env: &dispatch-env
  EVALUATION_SPLIT_SECRET: "${EVALUATION_SPLIT_SECRET:?EVALUATION_SPLIT_SECRET must be set in .env}"
  DEFAULT_TIME_LIMIT_SEC:
  DEFAULT_RAM_LIMIT_MB:
  DEFAULT_PUBLIC_EVAL_PERCENTAGE:
  CUSTOM_EVALUATOR_TIME_LIMIT_SECONDS:
  CELERY_TASK_SOFT_TIME_LIMIT:
  CELERY_TASK_TIME_LIMIT:

# Both internal workers share this definition; only the queues they consume differ
x-internal-worker: &internal-worker
  build: ./backend
  restart: always
  init: true
  cap_drop: ["ALL"]
  # Minimal cap set that still lets entrypoint.sh drop privileges to nobody
  # (setpriv needs SETUID/SETGID; pre-owned runtime dirs need CHOWN only for
  # fix-up). The container runs only internal/system queues — never untrusted
  # submission code (that lives in the separate eval-worker sandboxes).
  cap_add: ["CHOWN", "SETUID", "SETGID"]
  security_opt: ["no-new-privileges:true"]
  mem_limit: ${WORKER_MEM_LIMIT:-1g}
  cpus: ${WORKER_CPU_LIMIT:-2}
  environment: *internal-env
  depends_on:
    redis:
      condition: service_healthy
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
    redis-cache:
      condition: service_healthy
  volumes:
    - uploads_data:/app/uploads
    - backups_data:/backups
    - logs_data:/app/logs
    - hf_cache:/var/lib/lavbench/hf_cache
    - task_images_data:/var/lib/lavbench/task_images
    - workspace_data:/var/lib/lavbench/workspace
    - ./certs:/etc/ssl/certs/redis:ro
    - ./secrets:/run/secrets/lavbench:ro
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "celery -A tasks.celery inspect ping --timeout 5 || exit 1",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  # 1. PostgreSQL Database Container
  db:
    image: postgres:15-alpine
    container_name: lavbench_db
    restart: always
    # compose-v2 resource caps (deploy.resources.limits is Swarm-only and ignored by `docker compose up`).
    # The CPU cap is a CFS quota like the backend's (see there); DB_CPUS must be a whole number
    mem_limit: ${DB_MEMORY:-2g}
    cpu_period: 100000
    cpu_quota: ${DB_CPUS:-2}00000
    command: >
      postgres
      -c max_connections=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lavbench_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lavbench_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port — accessible via Docker network (db:5432)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lavbench_user} -d ${POSTGRES_DB:-lavbench_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis Message Broker for Celery Queue
  redis:
    image: redis:8.10-alpine
    container_name: lavbench_redis
    restart: always
    mem_limit: ${REDIS_BROKER_CONTAINER_MEMORY:-384m}
    cpus: "0.5"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_BROKER_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      REDIS_HEALTH_MIN_FREE_PERCENT: ${REDIS_HEALTH_MIN_FREE_PERCENT:-10}
    # Bound to loopback by default — remote workers must override REDIS_BIND=0.0.0.0
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning ping | grep -qx PONG &&
          redis-cli --no-auth-warning --raw INFO persistence |
          grep -q '^aof_last_write_status:ok' &&
          redis-cli --no-auth-warning --raw INFO memory |
          awk -F: -v free="$${REDIS_HEALTH_MIN_FREE_PERCENT}"
          '/^used_memory:/{gsub(/\r/, "", $$2); used=$$2}
          /^maxmemory:/{gsub(/\r/, "", $$2); max=$$2}
          END{exit !(max > 0 && used * 100 <= max * (100 - free))}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2b. Dedicated Redis Cache (keys, SSE state, locks) — internal only, no host port
  redis-cache:
    image: redis:8.10-alpine
    container_name: lavbench_redis_cache
    restart: always
    mem_limit: ${REDIS_CACHE_CONTAINER_MEMORY:-256m}
    cpus: "0.25"
    # volatile-lru: when full, evict the least recently used keys that carry a
    # TTL instead of refusing writes, so SSE log buffers cannot block submits
    command: >
      redis-server
      --save ""
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_CACHE_MAXMEMORY:-128mb}
      --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No memory-headroom check: with eviction, running near maxmemory is normal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning ping | grep -qx PONG &&
          redis-cli --no-auth-warning --raw INFO persistence | grep -q '^loading:0'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. One-shot database schema upgrade
  migrate:
    build: ./backend
    restart: "no"
    command: python scripts/migrate.py
    # No env_file: migrate.py reads only DATABASE_URL (plus the secrets the
    # server role requires at import), so no .env value can leak in here
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lavbench_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lavbench_db}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Flask API Backend
  backend:
    build: ./backend
    container_name: lavbench_backend
    restart: always
    # CPU cap as a CFS quota, Docker's documented equivalent of `cpus` (period
    # 100 ms, quota = CPUs x period). The engine rejects `cpus` above the host's
    # CPU count, but accepts a larger quota and then allows every CPU, so the
    # default also starts on smaller hosts. BACKEND_CPUS must be a whole number.
    cpu_period: 100000
    cpu_quota: ${BACKEND_CPUS:-4}00000
    mem_limit: ${BACKEND_MEMORY:-3g}
    env_file: *app-env-file
    environment:
      # In-network URLs only — .env's localhost URLs are for `make dev` and
      # must never be interpolated into the compose network.
      - WORKER_ROLE=server
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lavbench_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lavbench_db}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CACHE_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-cache:6379/1
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - HF_CACHE_DIR=/app/hf_cache
      - UPLOAD_FOLDER=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:80}
      - WORKER_PUBLIC_KEYS_JSON=${WORKER_PUBLIC_KEYS_JSON:?WORKER_PUBLIC_KEYS_JSON must be set in .env}
      - WORKER_CAPABILITY_SECRET=${WORKER_CAPABILITY_SECRET:?WORKER_CAPABILITY_SECRET must be set in .env}
      - EVALUATION_SPLIT_SECRET=${EVALUATION_SPLIT_SECRET:?EVALUATION_SPLIT_SECRET must be set in .env}
      - REDIS_SSL_CA_CERTS=${REDIS_SSL_CA_CERTS:-}
      - REDIS_SSL_CERTFILE=${REDIS_SSL_CERTFILE:-}
      - REDIS_SSL_KEYFILE=${REDIS_SSL_KEYFILE:-}
      - REDIS_SSL_CERT_REQS=${REDIS_SSL_CERT_REQS:-required}
      - REDIS_HEALTH_MIN_FREE_PERCENT=${REDIS_HEALTH_MIN_FREE_PERCENT:-10}
      - CHALLENGE_ARCHIVE_MAX_COMPRESSED_BYTES=${CHALLENGE_ARCHIVE_MAX_COMPRESSED_BYTES:-209715200}
      - CHALLENGE_ARCHIVE_MAX_UNCOMPRESSED_BYTES=${CHALLENGE_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-2147483648}
      - CHALLENGE_ARCHIVE_MAX_MEMBER_BYTES=${CHALLENGE_ARCHIVE_MAX_MEMBER_BYTES:-524288000}
      - CHALLENGE_ARCHIVE_MAX_MEMBERS=${CHALLENGE_ARCHIVE_MAX_MEMBERS:-1000}
      - CHALLENGE_ARCHIVE_MAX_COMPRESSION_RATIO=${CHALLENGE_ARCHIVE_MAX_COMPRESSION_RATIO:-100}
      - MAIN_SERVER_URL=${MAIN_SERVER_URL:-http://frontend:80}
      - BACKUPS_DIR=/backups
      # One gevent worker per CPU of the quota above
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-${BACKEND_CPUS:-4}}
    ulimits:
      nofile:
        soft: ${GUNICORN_ULIMIT_NOFILE:-65536}
        hard: ${GUNICORN_ULIMIT_NOFILE:-65536}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes:
      - hf_cache:/app/hf_cache
      - uploads_data:/app/uploads
      - backups_data:/backups
      - logs_data:/app/logs
      - ./certs:/etc/ssl/certs/redis:ro
      - ./secrets:/run/secrets/lavbench:ro
      - ./guides:/guides:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 5. Celery Beat (watchdog + backup scheduler)
  celery_beat:
    build: ./backend
    container_name: lavbench_beat
    restart: always
    command: celery -A tasks.celery beat --loglevel=info -s /app/run/celerybeat-schedule.db
    environment:
      # In-network URLs only — .env's localhost URLs are for `make dev` and
      # must never be interpolated into the compose network. The scheduler role
      # only runs beat (no app / no DB / no secrets), so it gets broker access
      # only.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CACHE_REDIS_URL=redis://:${REDIS_PASSWORD}@redis-cache:6379/1
      - WORKER_ROLE=scheduler
      - HF_CACHE_DIR=/app/hf_cache
      - NANOCOLAB_SYNC_INTERVAL_SECONDS=${NANOCOLAB_SYNC_INTERVAL_SECONDS:-60}
      - REDIS_SSL_CA_CERTS=${REDIS_SSL_CA_CERTS:-}
      - REDIS_SSL_CERTFILE=${REDIS_SSL_CERTFILE:-}
      - REDIS_SSL_KEYFILE=${REDIS_SSL_KEYFILE:-}
      - REDIS_SSL_CERT_REQS=${REDIS_SSL_CERT_REQS:-required}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      # Keeps the schedule file across restarts, so interval entries (weekly
      # prune, daily sweep) are not reset. The image pre-owns /app/run for
      # nobody, and a new named volume inherits that ownership.
      - beat_schedule_data:/app/run
      - ./certs:/etc/ssl/certs/redis:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A tasks.celery inspect ping --timeout 5 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 6. Celery Worker (internal/system tasks only): the short periodic jobs
  celery_worker:
    <<: *internal-worker
    container_name: lavbench_worker
    environment:
      <<: [*internal-env, *dispatch-env]
    command: sh -c 'celery -A tasks.celery worker --loglevel=info -Q celery,internal -c $${CELERY_WORKER_CONCURRENCY:-2}'

  # 6b. Celery Worker for the long system jobs (backups, nanoColab syncs), so a
  # backup never delays a leaderboard rebuild or the watchdog
  celery_worker_long:
    <<: *internal-worker
    container_name: lavbench_worker_long
    command: sh -c 'celery -A tasks.celery worker --loglevel=info -Q internal_long -c $${CELERY_WORKER_CONCURRENCY:-2}'

  # 7. React Frontend & Nginx Router
  frontend:
    build: ./frontend
    container_name: lavbench_frontend
    restart: always
    # Buffered API responses and gzip need more than the old 0.5 CPU; FRONTEND_CPUS is whole
    mem_limit: 512m
    environment:
      # One nginx worker per CPU of the quota; "auto" would count the host's CPUs
      NGINX_WORKER_PROCESSES: "${FRONTEND_CPUS:-1}"
    cpu_period: 100000
    cpu_quota: ${FRONTEND_CPUS:-1}00000
    # Each proxied SSE stream holds two descriptors; nginx.main.conf raises its limit to match
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - logs_data:/app/logs
      # TLS certs for the optional 443 listener. Empty/missing → HTTP-only
      # mode (nginx refuses to boot if cert files are referenced but absent,
      # so the entrypoint only enables the listener when the cert exists).
      - ./certs/web:/etc/nginx/ssl:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  hf_cache:
  uploads_data:
  backups_data:
  logs_data:
  task_images_data:
  workspace_data:
  beat_schedule_data:
