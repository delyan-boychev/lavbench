version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - env API_SPEC_SKIP_FETCH=true make -C docs fetch-spec
    # The BG docs are a separate Sphinx build (source/bg + -D language=bg);
    # deploy them under /bg/ so the language switcher links resolve.
    post_build:
      - make -C docs html-bg
      - rm -rf _readthedocs/html/bg
      - cp -r docs/build/html-bg _readthedocs/html/bg

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false
